[target.x86_64-pc-windows-msvc]
linker = "lld-link"
rustflags = ["-C", "linker-plugin-lto"]
env = {
  CC = "clang-cl",
  CXX = "clang-cl",
  CFLAGS = "-flto",
  CXXFLAGS = "-flto"
}

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "linker-plugin-lto",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--exclude-libs=ALL"
]

[target.x86_64-unknown-linux-gnu.env]
CC = "clang"
CXX = "clang++"

CFLAGS = """\
  -flto=full \
  -ffunction-sections \
  -fdata-sections \
  -fvisibility=hidden \
  -fvisibility-inlines-hidden \
  -fwhole-program-vtables \
  -fno-exceptions \
  -fno-rtti \
  -fno-unwind-tables \
  -fno-asynchronous-unwind-tables \
"""

CXXFLAGS = """\
  -flto=full \
  -ffunction-sections \
  -fdata-sections \
  -fvisibility=hidden \
  -fvisibility-inlines-hidden \
  -fwhole-program-vtables \
  -fno-exceptions \
  -fno-rtti \
  -fno-unwind-tables \
  -fno-asynchronous-unwind-tables \
"""