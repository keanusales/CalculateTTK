[target.x86_64-pc-windows-msvc]
linker = "lld-link"
rustflags = [
  "-C", "linker-plugin-lto",
  "-C", "target-cpu=native",
  "-C", "force-frame-pointers=no",
  "-C", "link-arg=/OPT:REF",
  "-C", "link-arg=/OPT:ICF",
  "-C", "link-arg=/OPT:LLDLTO=2",
  "-C", "link-arg=-opt:lldltocgo=2",
]

[target.x86_64-pc-windows-msvc.env]
CC = "clang-cl"
CXX = "clang-cl"
AR = "llvm-lib"
CFLAGS = "/clang:-Oz /clang:-flto=full /clang:-fuse-ld=lld-link /clang:-DNDEBUG /clang:-fmerge-all-constants /clang:-march=native"
CXXFLAGS = "/clang:-Oz /clang:-flto=full /clang:-fuse-ld=lld-link /clang:-DNDEBUG /clang:-fmerge-all-constants /clang:-march=native"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "linker-plugin-lto",
  "-C", "force-unwind-tables=no",
  "-C", "force-frame-pointers=no",
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,-O2",
  "-C", "link-arg=-Wl,--lto-O2",
  "-C", "link-arg=-Wl,--lto-CGO2",
  "-C", "link-arg=-Wl,--gc-sections",
  "-C", "link-arg=-Wl,--icf=all",
  "-C", "link-arg=-Wl,-z,pack-relative-relocs",
  "-C", "link-arg=-Wl,--as-needed",
  "-C", "link-arg=-Wl,--exclude-libs=ALL"
]

[target.x86_64-unknown-linux-gnu.env]
CC = "clang"
CXX = "clang++"