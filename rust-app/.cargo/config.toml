[target.x86_64-pc-windows-msvc]
linker = "lld-link"
rustflags = ["-C", "linker-plugin-lto"]
env = {
  CC = "clang-cl",
  CXX = "clang-cl",
  CFLAGS = "-flto",
  CXXFLAGS = "-flto"
}

[target.x86_64-unknown-linux-gnu]
linker = "clang" 
rustflags = [
  "-C", "linker-plugin-lto",
  "-C", "link-arg=-fuse-ld=lld" 
]
env = {
  CC = "clang",
  CXX = "clang++",
  CFLAGS = "-flto",
  CXXFLAGS = "-flto"
}